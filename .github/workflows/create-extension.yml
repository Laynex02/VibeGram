
name: Create VibeGram Native Extension

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-extension:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install flet==0.86.5

      - name: Generate extension template
        run: |
          rm -rf flet_firebase_auth
          flet create \
            --template extension \
            --project-name flet-firebase-auth \
            flet_firebase_auth

      - name: Save generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A flet_firebase_auth
          git commit -m "Generate native Flet extension template" || echo "No changes"
          git push
