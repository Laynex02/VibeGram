
name: Build VibeGram APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet[all]>=0.28,<1.0"

      - name: Build Android APK
        run: |
          flet build apk \
            --bundle-id com.vibegram.app \
            --yes \
            --verbose

      - name: Show APK SHA-1
        run: |
          APK=$(find build/apk -name "*.apk" | head -n 1)
          VERSION=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$VERSION/apksigner" verify --print-certs "$APK"

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: VibeGram-Android
          path: build/apk/*.apk
          if-no-files-found: error
