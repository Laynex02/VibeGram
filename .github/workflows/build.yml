
name: Build VibeGram APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            mesa-utils

      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;34.0.0"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet[all]==0.86.5"

      - name: Generate Flutter project
        run: |
          flet build apk \
            --bundle-id com.vibegram.app \
            --product "VibeGram" \
            --python-version 3.13 \
            --yes \
            --verbose || echo "Continuing with Kotlin fix"

      - name: Configure Flutter PATH
        run: |
          echo "$HOME/flutter/3.44.8/bin" >> $GITHUB_PATH

      - name: Accept Android licenses
        run: |
          flutter doctor --android-licenses || true

      - name: Fix Kotlin Gradle Plugin
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path("build/flutter/android")

          files = [
              root / "settings.gradle",
              root / "settings.gradle.kts",
              root / "build.gradle",
              root / "build.gradle.kts",
          ]

          patterns = [
              re.compile(
                  r'(id\s*\(?\s*["\']org\.jetbrains\.kotlin\.android'
                  r'["\']\s*\)?\s+version\s+["\'])[^"\']+(["\'])'
              ),
              re.compile(
                  r'(ext\.kotlin_version\s*=\s*["\'])[^"\']+(["\'])'
              ),
          ]

          changed = 0

          for file in files:
              if not file.exists():
                  continue

              content = file.read_text()

              for pattern in patterns:
                  content, count = pattern.subn(
                      lambda m: m.group(1) + "2.4.21" + m.group(2),
                      content
                  )
                  changed += count

              file.write_text(content)

              print(f"\n===== {file} =====")
              print(content)

          if changed == 0:
              print("ERROR: Kotlin version declaration not found!")
              sys.exit(1)

          print(f"\nUpdated Kotlin declarations: {changed}")
          PY

      - name: Verify Kotlin version
        run: |
          grep -n -E 'kotlin.android|kotlin_version' \
            build/flutter/android/settings.gradle \
            build/flutter/android/settings.gradle.kts \
            build/flutter/android/build.gradle \
            build/flutter/android/build.gradle.kts \
            2>/dev/null || true

      - name: Build Android APK
        run: |
          flet build apk \
            --bundle-id com.vibegram.app \
            --product "VibeGram" \
            --python-version 3.13 \
            --yes \
            --verbose

      - name: Inspect Android Gradle settings
        if: always()
        run: |
          echo "===== settings.gradle ====="
          cat build/flutter/android/settings.gradle || true

          echo "===== settings.gradle.kts ====="
          cat build/flutter/android/settings.gradle.kts || true

          echo "===== build.gradle ====="
          cat build/flutter/android/build.gradle || true

          echo "===== build.gradle.kts ====="
          cat build/flutter/android/build.gradle.kts || true

      - name: Show APK fingerprints
        if: success()
        run: |
          APK=$(find build/apk -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK file not found"
            exit 1
          fi

          VERSION=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)

          "$ANDROID_HOME/build-tools/$VERSION/apksigner" \
            verify --print-certs "$APK" | tee fingerprints.txt

          echo "========== SHA-1 =========="
          grep -i "SHA-1" fingerprints.txt || true

          echo "========== SHA-256 =========="
          grep -i "SHA-256" fingerprints.txt || true

      - name: Save APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VibeGram-Android
          path: build/apk/*.apk
          if-no-files-found: error
