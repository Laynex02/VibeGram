name: Build VibeGram APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet[all]==0.86.5"

      - name: Generate Android project
        run: |
          flet build apk \
            --bundle-id com.vibegram.app \
            --yes \
            --verbose || true

      - name: Fix Kotlin version
        run: |
          FILE="build/flutter/android/settings.gradle.kts"

          if [ -f "$FILE" ]; then
            sed -i 's/org.jetbrains.kotlin.android") version "[^"]*"/org.jetbrains.kotlin.android") version "2.1.0"/g' "$FILE"
            sed -i 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "2.1.0"/g' "$FILE"
          fi

          FILE="build/flutter/android/build.gradle.kts"

          if [ -f "$FILE" ]; then
            sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '2.1.0'/g" "$FILE"
          fi

      - name: Build Android APK
        run: |
          flet build apk \
            --bundle-id com.vibegram.app \
            --yes \
            --verbose

      - name: Inspect Android Gradle settings
        if: always()
        run: |
          echo "===== settings.gradle ====="
          cat build/flutter/android/settings.gradle || true

          echo "===== settings.gradle.kts ====="
          cat build/flutter/android/settings.gradle.kts || true

          echo "===== build.gradle ====="
          cat build/flutter/android/build.gradle || true

          echo "===== build.gradle.kts ====="
          cat build/flutter/android/build.gradle.kts || true

      - name: Show APK fingerprints
        if: success()
        run: |
          APK=$(find build/apk -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK file not found"
            exit 1
          fi

          VERSION=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)

          "$ANDROID_HOME/build-tools/$VERSION/apksigner" verify --print-certs "$APK" | tee fingerprints.txt

          echo "========== SHA-1 =========="
          grep -i "SHA-1" fingerprints.txt || true

          echo "========== SHA-256 =========="
          grep -i "SHA-256" fingerprints.txt || true

      - name: Save APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VibeGram-Android
          path: build/apk/*.apk
          if-no-files-found: error
